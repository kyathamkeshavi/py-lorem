steps:
  - label: "Run Python in Docker"
    plugins:
      docker#v3.8.0:
        image: "python:3.13"
        command:
          - "sh"
          - "-c"
          - "pip install . && python -c 'from loremipsum import sentence; print(sentence(max_char=20))' > result.txt"
    artifact_paths:
      - result.txt

  - label: "Annotate result"
    commands:
      - buildkite-agent artifact download result.txt .
      - buildkite-agent annotate --style "info" --context "sentence" "$(cat result.txt)"
